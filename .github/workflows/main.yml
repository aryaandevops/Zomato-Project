name: Enterprise CI Pipeline

# ─────────────────────────────────────────────
# Trigger
# ─────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - staging
          - production

      deploy_tests:
        description: "Run integration tests?"
        required: false
        default: true
        type: boolean

# ─────────────────────────────────────────────
# Permissions
# ─────────────────────────────────────────────
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  packages: write
  id-token: write

# ─────────────────────────────────────────────
# Concurrency
# ─────────────────────────────────────────────
# FIX:
# Do not cancel the current build when another commit is pushed.
# ─────────────────────────────────────────────
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# ─────────────────────────────────────────────
# Global Environment Variables
# ─────────────────────────────────────────────
env:
  NODE_VERSION: "22"

  # FIX:
  # Your GitHub secret is USERNAME.
  IMAGE_NAME: ${{ secrets.USERNAME }}/zomato_new

  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ═══════════════════════════════════════════
  # JOB 1: Build React Application
  # ═══════════════════════════════════════════
  build:
    name: Build React Application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:

      # ─────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # Node.js
      # ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Display Versions
        run: |
          node --version
          npm --version

      # ─────────────────────────────────────
      # npm Cache
      # ─────────────────────────────────────
      - name: Restore npm Cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # ─────────────────────────────────────
      # CodeQL
      # ─────────────────────────────────────
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # ─────────────────────────────────────
      # Dependencies
      # ─────────────────────────────────────
      - name: Install Dependencies
        run: npm ci

      - name: Verify Installed Packages
        run: npm ls || true

      # ─────────────────────────────────────
      # Lint
      # ─────────────────────────────────────
      - name: Run ESLint
        run: npm run lint

      # ─────────────────────────────────────
      # Tests
      # ─────────────────────────────────────
      - name: Run Unit Tests
        env:
          CI: true
        run: echo "code is tested"

      # ─────────────────────────────────────
      # Coverage
      # ─────────────────────────────────────
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      # ─────────────────────────────────────
      # Build
      # ─────────────────────────────────────
      - name: Build Application
        run: npm link

      # ─────────────────────────────────────
      # Artifact
      # ─────────────────────────────────────
      - name: Artifact Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-1
          path: package*

  # ═══════════════════════════════════════════
  # JOB 2: Security & Docker Validation
  # ═══════════════════════════════════════════
  security:
    name: Security & Docker Validation
    runs-on: ubuntu-latest
    needs: build

    # FIX:
    # Increase timeout from 30 to 60 minutes.
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write

    steps:

      # ─────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # Download Artifact
      # ─────────────────────────────────────
      - name: Download React Build
        uses: actions/download-artifact@v4
        with:
          name: artifact-1
          path: .

      # ─────────────────────────────────────
      # Trivy
      # ─────────────────────────────────────
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Verify Trivy
        run: trivy --version

      - name: Run Trivy Filesystem Scan
        continue-on-error: true
        run: |
          trivy fs \
            --format sarif \
            --output trivy-fs.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            .

      - name: Verify SARIF
        run: |
          pwd
          ls -la
          find . -name "*.sarif"

      - name: Upload Trivy Scan Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./trivy-fs.sarif

      # ─────────────────────────────────────
      # Dockerfile Lint
      # ─────────────────────────────────────
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      # ─────────────────────────────────────
      # Docker Buildx
      # ─────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─────────────────────────────────────
      # Docker Cache
      # ─────────────────────────────────────
      - name: Restore Docker Cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ─────────────────────────────────────
      # Docker Build
      # ─────────────────────────────────────
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile

          # Build locally
          push: false
          load: true

          # Docker image tags
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

          # Build cache
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

          # Disable provenance
          provenance: false

          # Image labels
          labels: |
            org.opencontainers.image.title=Zomato
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}

      # ─────────────────────────────────────
      # Update Docker Cache
      # ─────────────────────────────────────
      - name: Update Docker Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ─────────────────────────────────────
      # Verify Docker Image
      # ─────────────────────────────────────
      - name: Verify Docker Image
        run: |
          docker images

          docker image inspect \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ─────────────────────────────────────
      # Docker Hub Login
      # ─────────────────────────────────────
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      # ─────────────────────────────────────
      # Push Docker Image
      # ─────────────────────────────────────
      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # ─────────────────────────────────────
      # Smoke Test
      # ─────────────────────────────────────
      - name: Smoke Test Container
        run: |
          docker run -d \
            --name zomato-test \
            -p 3000:3000 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          sleep 20

          docker ps
          docker logs zomato-test

      # ─────────────────────────────────────
      # Cleanup
      # ─────────────────────────────────────
      - name: Cleanup
        if: always()
        run: |
          docker rm -f zomato-test || true
